<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ARCSTFUG App</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  background:#f4f6fb;
  color:#172033;
}

/* HEADER */
header{
  background:linear-gradient(135deg,#4f46e5,#7c3aed);
  color:white;
  padding:15px;
  position:sticky;
  top:0;
  z-index:1000;
  box-shadow:0 3px 15px #0002;
}

.navbar{
  max-width:1100px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:23px;
  font-weight:bold;
}

.logo small{
  display:block;
  font-size:11px;
  opacity:.85;
  margin-top:3px;
}

.admin-btn{
  border:0;
  background:white;
  color:#4f46e5;
  padding:10px 14px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

/* HERO */
.hero{
  max-width:1100px;
  margin:20px auto;
  padding:35px 25px;
  border-radius:20px;
  color:white;
  background:linear-gradient(135deg,#111827,#3730a3);
}

.hero h1{
  font-size:32px;
  margin-bottom:10px;
}

.hero p{
  line-height:1.6;
  color:#dbeafe;
}

/* SEARCH */
.search{
  max-width:1100px;
  margin:20px auto;
  padding:0 5px;
}

.search input{
  width:100%;
  padding:15px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:15px;
  outline:none;
}

/* CATEGORY */
.categories{
  max-width:1100px;
  margin:20px auto;
  padding:5px;
  display:flex;
  gap:10px;
  overflow-x:auto;
}

.category{
  border:0;
  padding:10px 17px;
  border-radius:20px;
  background:white;
  white-space:nowrap;
  cursor:pointer;
  box-shadow:0 2px 8px #0001;
}

.category.active{
  background:#4f46e5;
  color:white;
}

/* MAIN */
.container{
  max-width:1100px;
  margin:25px auto;
  padding:0 5px;
}

.section-title{
  margin-bottom:18px;
  font-size:23px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:18px;
}

.card{
  background:white;
  padding:20px;
  border-radius:17px;
  box-shadow:0 5px 18px #0001;
}

.icon{
  width:50px;
  height:50px;
  background:#ede9fe;
  border-radius:14px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:25px;
  margin-bottom:14px;
}

.card h3{
  margin-bottom:8px;
}

.card p{
  color:#667085;
  font-size:14px;
  line-height:1.5;
  margin-bottom:12px;
}

.card small{
  color:#667085;
}

/* BUTTONS */
.open-btn{
  display:inline-block;
  text-decoration:none;
  border:0;
  background:#4f46e5;
  color:white;
  padding:10px 14px;
  border-radius:9px;
  cursor:pointer;
  font-weight:bold;
  margin-top:12px;
}

.edit-btn{
  background:#f59e0b;
}

.delete-btn{
  background:#ef4444;
}

/* ADMIN */
.admin-panel{
  display:none;
  max-width:700px;
  margin:25px auto;
  background:white;
  padding:25px;
  border-radius:18px;
  box-shadow:0 5px 20px #0002;
}

.admin-panel h2{
  margin-bottom:18px;
}

.form-group{
  margin-bottom:15px;
}

.form-group label{
  display:block;
  margin-bottom:6px;
  font-weight:bold;
  font-size:14px;
}

.form-group input,
.form-group textarea,
.form-group select{
  width:100%;
  padding:12px;
  border:1px solid #d0d5dd;
  border-radius:9px;
  outline:none;
}

.form-group textarea{
  min-height:80px;
  resize:vertical;
}

.save-btn{
  width:100%;
  border:0;
  padding:13px;
  border-radius:10px;
  background:#16a34a;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.close-btn{
  width:100%;
  margin-top:8px;
  border:0;
  padding:11px;
  border-radius:10px;
  cursor:pointer;
}

/* FOOTER */
footer{
  margin-top:40px;
  padding:30px;
  text-align:center;
  background:#111827;
  color:white;
}

footer p{
  margin-top:6px;
  color:#cbd5e1;
  font-size:13px;
}

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:40px;
  color:#667085;
}

/* MOBILE */
@media(max-width:600px){

  .hero{
    margin:12px;
    padding:28px 20px;
  }

  .hero h1{
    font-size:26px;
  }

  .container,
  .search,
  .categories{
    margin-left:12px;
    margin-right:12px;
  }

  .logo{
    font-size:20px;
  }

  .admin-btn{
    font-size:12px;
    padding:9px;
  }
}
</style>
</head>

<body>

<!-- HEADER -->
<header>

<div class="navbar">

<div class="logo">
🚀 ARCSTFUG
<small>Education & Learning App</small>
</div>

<button class="admin-btn" onclick="toggleAdmin()">
⚙️ Add Link
</button>

</div>

</header>


<!-- HERO -->
<section class="hero">

<h1>Welcome to ARCSTFUG 👋</h1>

<p>
Your educational hub for lectures, courses, notes,
study materials and useful learning resources.
</p>

</section>


<!-- SEARCH -->
<div class="search">

<input
type="text"
id="searchInput"
placeholder="🔍 Search lectures, courses, notes..."
oninput="displayLinks()"
>

</div>


<!-- CATEGORIES -->
<div class="categories">

<button
class="category active"
onclick="filterCategory('All',this)">
All
</button>

<button
class="category"
onclick="filterCategory('JEE',this)">
JEE
</button>

<button
class="category"
onclick="filterCategory('NEET',this)">
NEET
</button>

<button
class="category"
onclick="filterCategory('Class 11',this)">
Class 11
</button>

<button
class="category"
onclick="filterCategory('Class 12',this)">
Class 12
</button>

<button
class="category"
onclick="filterCategory('Notes',this)">
Notes
</button>

<button
class="category"
onclick="filterCategory('Other',this)">
Other
</button>

</div>


<!-- ADMIN PANEL -->
<section class="admin-panel" id="adminPanel">

<h2>➕ Add New Resource</h2>

<div class="form-group">

<label>Title</label>

<input
id="linkTitle"
type="text"
placeholder="Example: Physics Lecture 01"
>

</div>


<div class="form-group">

<label>Description</label>

<textarea
id="linkDescription"
placeholder="Enter resource description"
></textarea>

</div>


<div class="form-group">

<label>Category</label>

<select id="linkCategory">

<option value="JEE">JEE</option>
<option value="NEET">NEET</option>
<option value="Class 11">Class 11</option>
<option value="Class 12">Class 12</option>
<option value="Notes">Notes</option>
<option value="Other">Other</option>

</select>

</div>


<div class="form-group">

<label>Resource Link</label>

<input
id="linkURL"
type="url"
placeholder="https://example.com"
>

</div>


<button
class="save-btn"
onclick="saveLink()">
💾 Save Resource
</button>


<button
class="close-btn"
onclick="toggleAdmin()">
Close
</button>

</section>


<!-- CONTENT -->
<main class="container">

<h2 class="section-title">
📚 ARCSTFUG Resources
</h2>

<div
class="cards"
id="linkContainer">
</div>

</main>


<!-- FOOTER -->
<footer>

<strong>🚀 ARCSTFUG APP</strong>

<p>
Learn • Practice • Achieve
</p>

<p>
© 2026 ARCSTFUG
</p>

</footer>


<script>

/* ===================================
   DEFAULT RESOURCES
=================================== */

const defaultLinks = [

{
id:1,

title:"🎓 EduVibe",

description:
"Open EduVibe educational platform.",

category:"Other",

url:"https://eduvibe-nt.pages.dev/"
},

{
id:2,

title:"JEE Main Official Website",

description:
"Official JEE Main information and updates.",

category:"JEE",

url:"https://jeemain.nta.nic.in/"
},

{
id:3,

title:"Physics Study Material",

description:
"Physics lectures and study resources.",

category:"JEE",

url:"https://example.com/"
},

{
id:4,

title:"Class 11 Study Material",

description:
"Useful Class 11 learning resources.",

category:"Class 11",

url:"https://example.com/"
},

{
id:5,

title:"Class 12 Notes",

description:
"Class 12 notes and study materials.",

category:"Class 12",

url:"https://example.com/"
}

];


/* ===================================
   LOAD LOCAL DATA
=================================== */

let savedLinks =
JSON.parse(
localStorage.getItem("arcstfug_links")
) || defaultLinks;


let currentCategory="All";


/* ===================================
   DISPLAY
=================================== */

function displayLinks(){

const container =
document.getElementById("linkContainer");

const search =
document.getElementById("searchInput")
.value
.toLowerCase();


const filtered =
savedLinks.filter(item=>{

const categoryMatch =
currentCategory==="All" ||
item.category===currentCategory;


const searchMatch =
item.title.toLowerCase().includes(search) ||

item.description
.toLowerCase()
.includes(search) ||

item.category
.toLowerCase()
.includes(search);


return categoryMatch && searchMatch;

});


container.innerHTML="";


if(filtered.length===0){

container.innerHTML=`

<div class="empty">

😕 No resource found.

</div>

`;

return;

}


filtered.forEach(item=>{

const card =
document.createElement("div");

card.className="card";


card.innerHTML=`

<div class="icon">

${getIcon(item.category)}

</div>


<h3>
${escapeHTML(item.title)}
</h3>


<p>
${escapeHTML(item.description)}
</p>


<small>
📁 ${escapeHTML(item.category)}
</small>


<br>


<a
class="open-btn"
href="${safeURL(item.url)}"
target="_blank"
rel="noopener noreferrer">

🔗 Open

</a>


<button
class="open-btn edit-btn"
onclick="editLink(${item.id})">

✏️

</button>


<button
class="open-btn delete-btn"
onclick="deleteLink(${item.id})">

🗑️

</button>

`;


container.appendChild(card);

});

}


/* ===================================
   ICON
=================================== */

function getIcon(category){

if(category==="JEE")
return "🎓";

if(category==="NEET")
return "🧬";

if(category==="Class 11")
return "📖";

if(category==="Class 12")
return "📚";

if(category==="Notes")
return "📝";

return "🔗";

}


/* ===================================
   ADMIN PANEL
=================================== */

function toggleAdmin(){

const panel =
document.getElementById("adminPanel");


if(panel.style.display==="block"){

panel.style.display="none";

}else{

panel.style.display="block";

panel.scrollIntoView({
behavior:"smooth"
});

}

}


/* ===================================
   SAVE
=================================== */

function saveLink(){

const title =
document.getElementById("linkTitle")
.value.trim();


const description =
document.getElementById("linkDescription")
.value.trim();


const category =
document.getElementById("linkCategory")
.value;


const url =
document.getElementById("linkURL")
.value.trim();


if(!title || !url){

alert("Please enter Title and URL.");

return;

}


if(!isValidURL(url)){

alert("Please enter a valid HTTPS/HTTP URL.");

return;

}


const newLink={

id:Date.now(),

title:title,

description:
description ||
"ARCSTFUG educational resource.",

category:category,

url:url

};


savedLinks.unshift(newLink);


localStorage.setItem(
"arcstfug_links",
JSON.stringify(savedLinks)
);


document.getElementById("linkTitle").value="";
document.getElementById("linkDescription").value="";
document.getElementById("linkURL").value="";


displayLinks();


alert("✅ Resource added successfully!");

}


/* ===================================
   EDIT
=================================== */

function editLink(id){

const item =
savedLinks.find(x=>x.id===id);


if(!item)return;


const title =
prompt("New title:",item.title);


if(title===null)return;


const description =
prompt(
"New description:",
item.description
);


if(description===null)return;


const url =
prompt("New URL:",item.url);


if(url===null)return;


if(!isValidURL(url)){

alert("Invalid URL.");

return;

}


item.title=title.trim();

item.description=description.trim();

item.url=url.trim();


localStorage.setItem(
"arcstfug_links",
JSON.stringify(savedLinks)
);


displayLinks();

}


/* ===================================
   DELETE
=================================== */

function deleteLink(id){

if(!confirm("Delete this resource?"))
return;


savedLinks =
savedLinks.filter(
item=>item.id!==id
);


localStorage.setItem(
"arcstfug_links",
JSON.stringify(savedLinks)
);


displayLinks();

}


/* ===================================
   CATEGORY
=================================== */

function filterCategory(category,button){

currentCategory=category;


document
.querySelectorAll(".category")
.forEach(btn=>{
btn.classList.remove("active");
});


button.classList.add("active");


displayLinks();

}


/* ===================================
   URL VALIDATION
=================================== */

function isValidURL(url){

try{

const parsed=new URL(url);

return(
parsed.protocol==="http:" ||
parsed.protocol==="https:"
);

}catch{

return false;

}

}


function safeURL(url){

return isValidURL(url)
?url
:"#";

}


/* ===================================
   SECURITY
=================================== */

function escapeHTML(text){

return String(text)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


/* ===================================
   START APP
=================================== */

displayLinks();

</script>

</body>
  </html>

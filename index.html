<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#09052b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ARCSTFUG — Education & Learning</title>

<!-- Google Identity Services Script -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
*{box-sizing:border-box}
:root{
  --navy:#09052b; --navy2:#120c3d; --purple:#6557e8;
  --text:#202124; --muted:#777; --bg:#f7f8fa; --card:#fff;
}
body{
  margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);
  color:var(--text);-webkit-tap-highlight-color:transparent;
}
button,input,select{font:inherit}
button{cursor:pointer}

.app{max-width:1200px;margin:auto;min-height:100vh;background:#0b0b0f;position:relative;padding-bottom:82px}

/* Header */
.hero{
  background:linear-gradient(145deg,#09052b,#17104b);
  color:white;padding:18px 18px 22px;border-radius:0 0 25px 25px;
  box-shadow:0 5px 18px rgba(0,0,0,.16);
}
.topbar{display:flex;align-items:center;gap:13px}
.menu{
  width:42px;height:42px;border:0;border-radius:13px;background:rgba(255,255,255,.10);
  color:#fff;font-size:25px;
}
.logo{display:flex;align-items:center;gap:10px;flex:1}
.logo-img{
  width:45px;height:45px;border-radius:12px;object-fit:cover;background:#0b0b0f;
  border:2px solid rgba(255,255,255,.35);
}
.logo-text{font-size:20px;font-weight:800;letter-spacing:.3px}
.logo-text small{display:block;font-size:10px;font-weight:500;opacity:.72;margin-top:3px}
.add-btn{
  border:0;background:#0b0b0f;color:#ffffff;border-radius:12px;padding:10px 12px;
  font-weight:700;font-size:13px;
}
.stats{display:flex;gap:10px;margin-top:18px; flex-wrap:wrap;}
.stat{
  flex:1; min-width:100px; background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.09);
  border-radius:14px;padding:10px;text-align:center;font-weight:800
}
.stat span{display:block;font-size:11px;font-weight:500;opacity:.7;margin-top:3px}

/* Banner */
.banner{
  margin:15px 16px 0;background:linear-gradient(110deg,#fff8e9,#fffdf8);
  border:1px solid #f0dfbb;border-radius:17px;padding:14px 15px;
  display:flex;gap:12px;align-items:center;
}
.banner-icon{font-size:25px}.banner b{font-size:15px}.banner p{margin:4px 0 0;color:#b8b8b8;font-size:12px;line-height:1.4}

/* Navaratri Poster Container */
.navaratri-container {
  margin: 20px 16px;
  text-align: center;
  background: #110e20;
  border: 1px solid #2a2245;
  border-radius: 17px;
  padding: 15px;
}
.navaratri-title {
  color: #ff9e3d;
  font-size: 20px;
  font-weight: 800;
  margin: 0 0 12px;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.navaratri-poster {
  width: 100%;
  max-width: 400px;
  border-radius: 12px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.6);
}

/* Main */
.section{padding:18px 16px 0}
.section-title{font-size:21px;font-weight:800;margin:0 0 13px}

/* Responsive Grid for PC/TV */
.quick-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(110px, 1fr));gap:9px}
.quick{
  border:0;background:#15151a;border-radius:17px;padding:14px 5px;
  min-height:92px;color:#e8e8e8;font-weight:700
}
.quick .ico{
  width:43px;height:43px;border-radius:14px;margin:0 auto 8px;display:grid;
  place-items:center;font-size:22px;background:#24242b9ff
}
.quick small{font-size:11px;display:block;line-height:1.2}

.filter{display:flex;gap:8px;overflow:auto;padding:2px 0 12px}
.filter::-webkit-scrollbar{display:none}
.chip{
  white-space:nowrap;border:1px solid #303038;background:#0b0b0f;border-radius:22px;
  padding:8px 13px;font-size:12px;color:#c9c9c9
}
.chip.active{background:#000000;color:#fff;border-color:#ffffff}

/* Responsive Study Links */
.links{display:grid;grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));gap:15px}
.card{
  border:1px solid #29292f;border-radius:17px;background:#0b0b0f;padding:15px;
  box-shadow:0 3px 12px rgba(25,20,60,.05); display: flex; flex-direction: column; justify-content: space-between;
}
.card-top{display:flex;gap:12px;align-items:flex-start}
.card-icon{
  width:45px;height:45px;border-radius:13px;background:#24242baff;display:grid;
  place-items:center;font-size:23px;flex:none
}
.card h3{margin:0;font-size:15px;line-height:1.3}
.card p{margin:5px 0;color:#999;font-size:12px;line-height:1.35}
.badge{
  display:inline-block;background:#102617;color:#61d889;border-radius:7px;
  padding:4px 7px;font-size:10px;font-weight:700;margin-top:3px
}
.open{
  width:100%;margin-top:12px;border:0;border-radius:11px;background:#000000;
  color:#fff;padding:11px;font-weight:700
}

/* Contact / App Details Grid */
.contact-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.contact-item {
  display: flex; align-items: center; gap: 14px; background: #15151a; border: 1px solid #29292f;
  padding: 14px 15px; border-radius: 14px; text-decoration: none; color: #ddd; transition: background 0.2s;
}
.contact-item:hover { background: #1c1c24; }
.contact-icon { font-size: 24px; }
.contact-text { font-size: 14px; font-weight: 700; color: #fff; }
.contact-text small { display: block; font-size: 11px; color: #aaa; font-weight: 400; margin-top: 3px; }

/* Drawer */
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:20;display:none}
.drawer{
  position:absolute;left:0;top:0;width:min(88vw,380px);height:100%;background:#0b0b0f;
  padding:20px 18px;overflow:auto
}
.drawer-bg.show{display:block}
.profile{display:flex;gap:12px;align-items:center;padding:8px 5px 20px}
.avatar{width:54px;height:54px;border-radius:50%;background:#173d29;display:grid;place-items:center;font-size:28px;object-fit:cover; border:2px solid #29292f;}
.profile b{font-size:18px}.profile small{display:block;color:#999;margin-top:3px}
.drawer hr{border:0;border-top:1px solid #29292f;margin:8px 0 14px}
.drawer-item{
  width:100%;border:0;background:#0b0b0f;text-align:left;padding:14px 10px;border-radius:12px;
  font-size:16px;color:#dedede
}
.drawer-item:hover{background:#f5f5f7}
.close{float:right;border:0;background:#25252b;border-radius:10px;width:38px;height:38px;font-size:20px}

/* Modal */
.modal-bg{position:fixed;inset:0

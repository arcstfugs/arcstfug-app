<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARCSTFUG APP</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #172033;
    }

    /* HEADER */
    header {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      padding: 16px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 3px 12px rgba(0,0,0,.15);
    }

    .header-content {
      max-width: 1100px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .logo {
      font-size: 23px;
      font-weight: bold;
    }

    .logo span {
      display: block;
      font-size: 11px;
      opacity: .85;
      margin-top: 3px;
    }

    .admin-btn {
      border: none;
      background: white;
      color: #5b21b6;
      padding: 10px 15px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    /* HERO */
    .hero {
      max-width: 1100px;
      margin: 20px auto;
      padding: 35px 25px;
      border-radius: 20px;
      background: linear-gradient(135deg, #111827, #312e81);
      color: white;
    }

    .hero h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #dbeafe;
      line-height: 1.6;
    }

    /* SEARCH */
    .search-box {
      max-width: 1100px;
      margin: 20px auto;
      padding: 0 5px;
    }

    .search-box input {
      width: 100%;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 12px;
      outline: none;
      font-size: 15px;
    }

    /* CATEGORY */
    .categories {
      max-width: 1100px;
      margin: 20px auto;
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 5px;
    }

    .category {
      white-space: nowrap;
      border: none;
      padding: 10px 16px;
      border-radius: 20px;
      background: white;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .category.active {
      background: #4f46e5;
      color: white;
    }

    /* CONTENT */
    .container {
      max-width: 1100px;
      margin: 25px auto;
      padding: 0 5px;
    }

    .section-title {
      margin-bottom: 15px;
      font-size: 22px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 5px 18px rgba(0,0,0,.08);
      transition: .2s;
    }

    .card:hover {
      transform: translateY(-3px);
    }

    .icon {
      width: 48px;
      height: 48px;
      border-radius: 13px;
      background: #ede9fe;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 14px;
    }

    .card h3 {
      margin-bottom: 8px;
    }

    .card p {
      color: #667085;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 15px;
    }

    .open-btn {
      display: inline-block;
      text-decoration: none;
      background: #4f46e5;
      color: white;
      padding: 10px 15px;
      border-radius: 9px;
      font-size: 14px;
      border: none;
      cursor: pointer;
    }

    .edit-btn {
      background: #f59e0b;
      margin-left: 5px;
    }

    .delete-btn {
      background: #ef4444;
      margin-left: 5px;
    }

    /* ADMIN PANEL */
    .admin-panel {
      display: none;
      max-width: 700px;
      margin: 25px auto;
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,.1);
    }

    .admin-panel h2 {
      margin-bottom: 18px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      font-size: 14px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #d0d5dd;
      border-radius: 9px;
      outline: none;
      font-size: 14px;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .save-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #16a34a;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .close-btn {
      width: 100%;
      margin-top: 8px;
      padding: 11px;
      border: none;
      border-radius: 10px;
      background: #e5e7eb;
      cursor: pointer;
    }

    /* FOOTER */
    footer {
      margin-top: 40px;
      padding: 25px;
      text-align: center;
      background: #111827;
      color: white;
    }

    footer p {
      color: #cbd5e1;
      margin-top: 5px;
      font-size: 13px;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #667085;
      grid-column: 1/-1;
    }

    @media(max-width:600px) {
      .hero h1 {
        font-size: 25px;
      }

      .header-content {
        flex-direction: row;
      }

      .admin-btn {
        padding: 8px 10px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

<!-- HEADER -->
<header>
  <div class="header-content">
    <div class="logo">
      🚀 ARCSTFUG
      <span>Education & Learning App</span>
    </div>

    <button class="admin-btn" onclick="toggleAdmin()">
      ⚙️ Add Link
    </button>
  </div>
</header>


<!-- HERO -->
<section class="hero">
  <h1>Welcome to ARCSTFUG</h1>
  <p>
    Learn, watch lectures, access study materials and explore useful
    educational resources in one place.
  </p>
</section>


<!-- SEARCH -->
<div class="search-box">
  <input
    type="text"
    id="searchInput"
    placeholder="🔍 Search courses, lectures, notes..."
    oninput="searchLinks()"
  >
</div>


<!-- CATEGORY -->
<div class="categories">
  <button class="category active" onclick="filterCategory('All', this)">All</button>
  <button class="category" onclick="filterCategory('JEE', this)">JEE</button>
  <button class="category" onclick="filterCategory('NEET', this)">NEET</button>
  <button class="category" onclick="filterCategory('Class 11', this)">Class 11</button>
  <button class="category" onclick="filterCategory('Class 12', this)">Class 12</button>
  <button class="category" onclick="filterCategory('Notes', this)">Notes</button>
  <button class="category" onclick="filterCategory('Other', this)">Other</button>
</div>


<!-- ADMIN PANEL -->
<section class="admin-panel" id="adminPanel">

  <h2>➕ Add New Link</h2>

  <div class="form-group">
    <label>Title</label>
    <input
      type="text"
      id="linkTitle"
      placeholder="Example: Physics Lecture 01"
    >
  </div>

  <div class="form-group">
    <label>Description</label>
    <textarea
      id="linkDescription"
      placeholder="Enter lecture or material description"
    ></textarea>
  </div>

  <div class="form-group">
    <label>Category</label>

    <select id="linkCategory">
      <option value="JEE">JEE</option>
      <option value="NEET">NEET</option>
      <option value="Class 11">Class 11</option>
      <option value="Class 12">Class 12</option>
      <option value="Notes">Notes</option>
      <option value="Other">Other</option>
    </select>
  </div>

  <div class="form-group">
    <label>Link / URL</label>
    <input
      type="url"
      id="linkURL"
      placeholder="https://example.com/lecture"
    >
  </div>

  <button class="save-btn" onclick="saveLink()">
    💾 Save Link
  </button>

  <button class="close-btn" onclick="toggleAdmin()">
    Close
  </button>

</section>


<!-- MAIN CONTENT -->
<main class="container">

  <h2 class="section-title">📚 Study Materials</h2>

  <div class="cards" id="linkContainer"></div>

</main>


<!-- FOOTER -->
<footer>
  <strong>🚀 ARCSTFUG APP</strong>
  <p>Learn • Practice • Achieve</p>
  <p>© 2026 ARCSTFUG. All Rights Reserved.</p>
</footer>


<script>

  /* --------------------------------
     DEFAULT LINKS
  -------------------------------- */

  const defaultLinks = [
    {
      id: 1,
      title: "JEE Preparation",
      description: "JEE preparation resources and useful study materials.",
      category: "JEE",
      url: "https://www.jeemain.nta.nic.in/"
    },
    {
      id: 2,
      title: "Physics Study Material",
      description: "Physics lectures and study resources.",
      category: "JEE",
      url: "https://example.com/"
    },
    {
      id: 3,
      title: "Class 11 Notes",
      description: "Class 11 educational notes and resources.",
      category: "Class 11",
      url: "https://example.com/"
    }
  ];


  /* --------------------------------
     LOAD DATA
  -------------------------------- */

  let savedLinks =
    JSON.parse(localStorage.getItem("arcstfug_links")) || defaultLinks;

  let currentCategory = "All";


  /* --------------------------------
     DISPLAY LINKS
  -------------------------------- */

  function displayLinks() {

    const container =
      document.getElementById("linkContainer");

    const search =
      document.getElementById("searchInput")
      .value
      .toLowerCase();

    let filtered = savedLinks.filter(item => {

      const categoryMatch =
        currentCategory === "All" ||
        item.category === currentCategory;

      const searchMatch =
        item.title.toLowerCase().includes(search) ||
        item.description.toLowerCase().includes(search) ||
        item.category.toLowerCase().includes(search);

      return categoryMatch && searchMatch;
    });


    container.innerHTML = "";


    if (filtered.length === 0) {

      container.innerHTML = `
        <div class="empty">
          😕 No material found.
        </div>
      `;

      return;
    }


    filtered.forEach(item => {

      const card = document.createElement("div");

      card.className = "card";

      card.innerHTML = `

        <div class="icon">
          ${getIcon(item.category)}
        </div>

        <h3>${escapeHTML(item.title)}</h3>

        <p>
          ${escapeHTML(item.description)}
        </p>

        <small>
          📁 ${escapeHTML(item.category)}
        </small>

        <br><br>

        <a
          class="open-btn"
          href="${safeURL(item.url)}"
          target="_blank"
          rel="noopener noreferrer"
        >
          🔗 Open
        </a>

        <button
          class="open-btn edit-btn"
          onclick="editLink(${item.id})"
        >
          ✏️
        </button>

        <button
          class="open-btn delete-btn"
          onclick="deleteLink(${item.id})"
        >
          🗑️
        </button>

      `;

      container.appendChild(card);

    });
  }


  /* --------------------------------
     ICON
  -------------------------------- */

  function getIcon(category) {

    if (category === "JEE") return "🎓";
    if (category === "NEET") return "🧬";
    if (category === "Class 11") return "📖";
    if (category === "Class 12") return "📚";
    if (category === "Notes") return "📝";

    return "🔗";
  }


  /* --------------------------------
     ADMIN PANEL
  -------------------------------- */

  function toggleAdmin() {

    const panel =
      document.getElementById("adminPanel");

    if (panel.style.display === "block") {

      panel.style.display = "none";

    } else {

      panel.style.display = "block";

      window.scrollTo({
        top: panel.offsetTop - 80,
        behavior: "smooth"
      });

    }
  }


  /* --------------------------------
     SAVE LINK
  -------------------------------- */

  function saveLink() {

    const title =
      document.getElementById("linkTitle").value.trim();

    const description =
      document.getElementById("linkDescription").value.trim();

    const category =
      document.getElementById("linkCategory").value;

    const url =
      document.getElementById("linkURL").value.trim();


    if (!title || !url) {

      alert("Please enter Title and URL.");

      return;
    }


    if (!isValidURL(url)) {

      alert("Please enter a valid http/https URL.");

      return;
    }


    const newLink = {

      id: Date.now(),

      title: title,

      description:
        description || "ARCSTFUG educational resource.",

      category: category,

      url: url

    };


    savedLinks.unshift(newLink);


    localStorage.setItem(
      "arcstfug_links",
      JSON.stringify(savedLinks)
    );


    document.getElementById("linkTitle").value = "";
    document.getElementById("linkDescription").value = "";
    document.getElementById("linkURL").value = "";


    displayLinks();

    alert("✅ Link successfully added!");

  }


  /* --------------------------------
     EDIT LINK
  -------------------------------- */

  function editLink(id) {

    const item =
      savedLinks.find(x => x.id === id);

    if (!item) return;


    const title =
      prompt("Enter new title:", item.title);

    if (title === null) return;


    const description =
      prompt(
        "Enter new description:",
        item.description
      );

    if (description === null) return;


    const url =
      prompt("Enter new URL:", item.url);

    if (url === null) return;


    if (!isValidURL(url)) {

      alert("Invalid URL.");

      return;
    }


    item.title = title.trim();
    item.description = description.trim();
    item.url = url.trim();


    localStorage.setItem(
      "arcstfug_links",
      JSON.stringify(savedLinks)
    );


    displayLinks();

  }


  /* --------------------------------
     DELETE LINK
  -------------------------------- */

  function deleteLink(id) {

    const confirmDelete =
      confirm("Delete this link?");

    if (!confirmDelete) return;


    savedLinks =
      savedLinks.filter(item => item.id !== id);


    localStorage.setItem(
      "arcstfug_links",
      JSON.stringify(savedLinks)
    );


    displayLinks();

  }


  /* --------------------------------
     CATEGORY FILTER
  -------------------------------- */

  function filterCategory(category, button) {

    currentCategory = category;


    document
      .querySelectorAll(".category")
      .forEach(btn => {

        btn.classList.remove("active");

      });


    button.classList.add("active");


    displayLinks();

  }


  /* --------------------------------
     SEARCH
  -------------------------------- */

  function searchLinks() {

    displayLinks();

  }


  /* --------------------------------
     URL VALIDATION
  -------------------------------- */

  function isValidURL(url) {

    try {

      const parsed =
        new URL(url);

      return (
        parsed.protocol === "http:" ||
        parsed.protocol === "https:"
      );

    } catch {

      return false;

    }

  }


  function safeURL(url) {

    return isValidURL(url)
      ? url
      : "#";

  }


  /* --------------------------------
     HTML ESCAPE
  -------------------------------- */

  function escapeHTML(text) {

    return String(text)

      .replace(/&/g, "&amp;")

      .replace(/</g, "&lt;")

      .replace(/>/g, "&gt;")

      .replace(/"/g, "&quot;")

      .replace(/'/g, "&#039;");

  }


  /* --------------------------------
     INITIAL LOAD
  -------------------------------- */

  displayLinks();

</script>

</body>
  </html>

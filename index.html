<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study App</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; color: #333; }
        header { background-color: #0d3b66; color: #fff; padding: 15px; text-align: center; font-size: 24px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .container { padding: 20px; max-width: 800px; margin: auto; }
        .card { background-color: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .card h2 { color: #f4a261; margin-bottom: 10px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn { background-color: #0d3b66; color: #fff; padding: 15px; text-align: center; border-radius: 10px; cursor: pointer; font-weight: bold; transition: background-color 0.3s; }
        .btn:hover { background-color: #f4a261; }
        ul { list-style: none; margin-top: 10px; }
        li { padding: 10px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>
    <header>My Study App</header>
    <div class="container">
        <div class="card">
            <h2>Live Classes</h2>
            <p>Join today's scheduled live lectures and interact with teachers.</p>
            <div style="margin-top: 15px;" class="btn">Join Live Class</div>
        </div>
        <div class="grid">
            <div class="card">
                <h2>My Courses</h2>
                <ul>
                    <li>Physics - Class 12</li>
                    <li>Chemistry - Class 12</li>
                    <li>Mathematics - Class 12</li>
                </ul>
            </div>
            <div class="card">
                <h2>Recent Updates</h2>
                <ul>
                    <li>New DPP uploaded for Physics.</li>
                    <li>Maths test schedule released.</li>
                </ul>
            </div>
        </div>
    </div>
</body>
</html>
